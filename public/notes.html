<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>便條</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<style>
  /* The notes in a window of their own: all of them, or (?id=) one sheet. */
  :root { --bg: #f6f6f3; --ink: #1c1c1a; --muted: #6d6d68; --faint: #a3a39d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --ink: #ecebe6; --muted: #a09f99; --faint: #6b6a65; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif; }
  #app { display: flex; flex-direction: column; min-height: 100%; padding: 12px; }
  .sub { margin: 4px 2px 10px; font-size: 12px; color: var(--muted); }
  .notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .note { display: flex; flex-direction: column; min-height: 132px; padding: 10px 10px 6px; border-radius: 4px 4px 12px 4px; background: var(--paper); color: #2a2622; box-shadow: 0 2px 6px rgba(0,0,0,.16); }
  .note:focus-within { box-shadow: 0 0 0 2px var(--ink), 0 2px 6px rgba(0,0,0,.16); }
  .note textarea { flex: 1; min-height: 78px; padding: 0; border: 0; outline: 0; resize: none; background: none; color: inherit; font: inherit; font-size: 13px; line-height: 1.45; }
  .note textarea::placeholder { color: rgba(42,38,34,.45); }
  .note.done textarea { text-decoration: line-through; opacity: .55; }
  .note .bar { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 11px; }
  .note .bar label { display: flex; align-items: center; gap: 3px; cursor: pointer; }
  .note .bar input { margin: 0; accent-color: #2a2622; }
  .note .dots { display: flex; gap: 4px; margin-left: auto; }
  .note .dots button { width: 13px; height: 13px; padding: 0; border: 1px solid rgba(42,38,34,.35); border-radius: 50%; cursor: pointer; }
  .note .dots button.on { outline: 2px solid #2a2622; outline-offset: 1px; }
  .note .del, .note .pop { padding: 0 3px; border: 0; background: none; color: inherit; font: inherit; font-size: 13px; opacity: .55; cursor: pointer; }
  .note .del:hover, .note .pop:hover { opacity: 1; }
  .note.add { align-items: center; justify-content: center; border: 1px dashed var(--faint); background: none; color: var(--muted); box-shadow: none; font: inherit; font-size: 13px; cursor: pointer; }
  .note.add:hover { color: var(--ink); border-color: var(--ink); }
  .notes-foot { display: flex; align-items: center; gap: 8px; min-height: 20px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .notes-foot .bad { color: #e5484d; }
  .notes-foot button, .gone-close { padding: 0; border: 0; background: none; color: var(--ink); font: inherit; text-decoration: underline; cursor: pointer; }

  /* one sheet: the paper is the window */
  body.one:not(.gone) { background: var(--paper); }
  body.one #app { height: 100%; padding: 0; }
  body.one .note { flex: 1; min-height: 0; padding: 12px 12px 4px; border-radius: 0; box-shadow: none; }
  body.one .note textarea { min-height: 0; font-size: 14px; }
  body.one .notes-foot { min-height: 18px; margin: 0; padding: 0 12px 4px; font-size: 11px; }
  body.one:not(.gone) .notes-foot { color: rgba(42,38,34,.6); }
  body.one:not(.gone) .notes-foot .bad { color: #b3261e; }
  body.one:not(.gone) .notes-foot button { color: #2a2622; }
  body.one.gone #app { padding: 12px; }

  /* pinned on top of everything (?pin=1): a small window, so less around the notes */
  html.pin #app { padding: 8px; }
  html.pin .notes { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  html.pin .note { min-height: 96px; }
  html.pin .note textarea { min-height: 46px; }
  html.pin .note .bar label { white-space: nowrap; }
</style>
</head>
<body>
<main id="app"></main>
<script src="/i18n.js"></script>
<script src="/notes.js"></script>
<script>
// This office speaks Traditional Chinese, as the office page does.
const L = I18N['zh-TW'] || I18N.en;
const N = () => (L.rep && L.rep.notes) || I18N.en.rep.notes;
const esc = NoteBook.esc;
// ?id= shows that one note; without it the window holds them all.
// (An id that could not be a note's shows as a note that is gone.)
const ASKED = new URLSearchParams(location.search).get('id');
const ONLY = ASKED == null ? '' : /^[a-z0-9]{1,24}$/i.test(ASKED) ? ASKED : '-';
// ?pin=1: this page is inside the window that stays on top (NoteBook.pin).
const PIN = new URLSearchParams(location.search).has('pin');
const app = document.getElementById('app');
document.documentElement.lang = L.html;
document.documentElement.classList.toggle('pin', PIN);

const book = new NoteBook({ text: N, canPop: !ONLY && !PIN, changed: look, render: draw });
const mine = () => (ONLY ? book.list.find((x) => x.id === ONLY) : null);

// The name on the window, and the colour of the paper behind one sheet.
function look() {
  const n = mine();
  const line = n ? String(n.text || '').split('\n')[0].trim().slice(0, 24) : '';
  const todo = book.todo.length;
  document.title = ONLY ? (line || N().tab) : N().tab + (todo ? ` (${todo})` : '');
  document.body.style.setProperty('--paper', n ? book.colour(n) : 'transparent');
}
function draw(focusId) {
  const page = document.scrollingElement, top = page.scrollTop;
  const n = mine();
  if (!ONLY) {
    document.body.className = '';
    app.innerHTML = book.body();
  } else if (book.unseen() || !n) {
    // the note was taken off the board (here or in another window)
    document.body.className = 'one gone';
    app.innerHTML = book.unseen() || `<div class="sub">${esc(N().gone)} <button type="button" class="gone-close" data-w="close">${esc(L.rep.close)}</button></div>${book.foot(false)}`;
  } else {
    document.body.className = 'one';
    app.innerHTML = book.card(n) + book.foot(false);
  }
  page.scrollTop = top;
  const ta = focusId && app.querySelector(`.note[data-id="${focusId}"] textarea`);
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }   // carry on where the note ends
  look();
}

app.addEventListener('click', (e) => {
  if (e.target.closest('[data-w=close]')) { window.close(); return; }
  if (e.target.closest('[data-n]')) book.click(e);
});
app.addEventListener('input', (e) => book.input(e));

book.load().then(() => draw(ONLY));
NoteBook.keepPlace();
</script>
</body>
</html>
